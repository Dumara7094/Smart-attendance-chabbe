<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART Attendance</title><meta name="theme-color" content="#0757d9"><script src="https://unpkg.com/html5-qrcode" defer></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}.cover{min-height:100vh;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#0757d9,#11a7ff);color:#fff}.box{padding:28px}.app{display:none}header{background:#0757d9;color:#fff;padding:20px;text-align:center}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;padding:18px;margin:14px 0;border-radius:18px;box-shadow:0 5px 20px #0001}button{border:0;border-radius:12px;padding:12px 17px;margin:5px;background:#0757d9;color:#fff;font-size:15px}input{padding:12px;border:1px solid #ccd4e0;border-radius:10px;width:90%;margin:6px 0}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}.ok{color:green;font-weight:bold}.err{color:#b42318;font-weight:bold}.hide{display:none}#reader{max-width:420px;margin:10px auto}</style></head><body><section class="cover" id="cover"><div class="box"><h1>እንኳን ደህና መጡ</h1><h2>SMART Attendance</h2><p>ሥራ ሠራተኞችና ቴክኖሎጂ ልማት ጽ/ቤት</p><p>QR + GPS የሠራተኞች መግቢያና መውጫ</p><button onclick="openApp()">App ይክፈቱ</button></div></section><section class="app" id="app"><header><h1>SMART Attendance</h1><p>ሠራተኞችና ቴክኖሎጂ ልማት ጽ/ቤት</p></header><div class="wrap"><div class="card"><h2>የሥራ ሰዓት</h2><p>📅 ሰኞ–ዓርብ</p><p>🟢 መግቢያ፦ 2:30–3:00</p><p>🔴 መውጫ፦ 11:00–11:30</p></div><div class="card"><h2>Check-in / Check-out</h2><input id="id" placeholder="Employee ID ለምሳሌ 001"><div><button onclick="scan()">📷 QR Scan</button><button onclick="locate()">📍 GPS አረጋግጥ</button></div><button onclick="attend('in')">🟢 Check-in</button><button onclick="attend('out')">🔴 Check-out</button><p id="msg"></p><div id="reader"></div></div><div class="card"><h2>የዛሬ መዝገብ</h2><table><thead><tr><th>ID</th><th>ስም</th><th>ግቢ</th><th>ወጣ</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card"><h2>Admin</h2><input id="pin" type="password" placeholder="Admin PIN"><button onclick="admin()">🔐 ግባ</button><div id="panel" class="hide"><button onclick="report()">📄 CSV Report</button></div></div></div></section><script>const E=[['001','ዱማራ ዱዌ አርሴ'],['002','መስቀል ሳሙኤል ላሚሶ'],['003','መንግስቱ ማቴዎስ'],['004','አሸናፍ ኢንድራስ'],['005','አክልሉ አባዬ'],['006','አየለ አባ'],['007','ሻሻሞ ሻላ'],['008','ዳዊት ቦርሳሞ'],['009','አሥራት አመሎ'],['010','ህሩት ሀላላ'],['011','ታደሠ ጉጆላ'],['012','ደስታ ዳኩራ'],['013','አጥናፉ ሀሮ'],['014','አገኘ በየኔ'],['015','አብነት ላሚሶ'],['016','አበራ አስረስ'],['017','ገናለ ጋጋ'],['018','ሎተር ጌታቸው'],['019','ወንድሙ የተራ'],['020','አሸኛፍ ማጃ']];const KEY='smart-attendance-v1';function openApp(){cover.style.display='none';app.style.display='block'}function date(){return new Date().toISOString().slice(0,10)}function time(){return new Date().toLocaleTimeString('am-ET',{hour:'2-digit',minute:'2-digit',hour12:false})}function data(){return JSON.parse(localStorage.getItem(KEY)||'{}')}function save(x){localStorage.setItem(KEY,JSON.stringify(x));render()}function workday(){let d=new Date().getDay();return d>=1&&d<=5}function msg(t,c){document.getElementById('msg').textContent=t;document.getElementById('msg').className=c||''}function attend(type){let id=document.getElementById('id').value.trim().padStart(3,'0'),e=E.find(x=>x[0]===id);if(!e)return msg('ID አልተገኘም።','err');if(!workday())return msg('ዛሬ የሥራ ቀን አይደለም።','err');let d=data(),day=d[date()]||{};day[id]=day[id]||{name:e[1],in:'',out:''};if(type==='in'){if(day[id].in)return msg('Check-in ቀድሞ ተመዝግቧል።','err');day[id].in=time()}else{if(!day[id].in)return msg('መጀመሪያ Check-in ያድርጉ።','err');if(day[id].out)return msg('Check-out ቀድሞ ተመዝግቧል።','err');day[id].out=time()}d[date()]=day;save(d);msg(e[1]+' — ተመዝግቧል።','ok')}function render(){let day=data()[date()]||{},s='';Object.keys(day).forEach(id=>{let r=day[id];s+=`<tr><td>${id}</td><td>${r.name}</td><td>${r.in||'-'}</td><td>${r.out||'-'}</td></tr>`});rows.innerHTML=s||'<tr><td colspan="4">ዛሬ መዝገብ የለም።</td></tr>'}function locate(){if(!navigator.geolocation)return msg('GPS አይደገፍም።','err');navigator.geolocation.getCurrentPosition(p=>msg('GPS ተረጋግጧል። አሁን Check-in/Check-out ይጫኑ።','ok'),()=>msg('የGPS ፈቃድ አልተሰጠም።','err'),{enableHighAccuracy:true,timeout:10000})}async function scan(){if(typeof Html5Qrcode==='undefined')return msg('QR Scanner እየተጫነ ነው።','err');let q=new Html5Qrcode('reader');try{await q.start({facingMode:'environment'},{fps:10,qrbox:250},async t=>{let id=t.replace(/\D/g,'').slice(-3).padStart(3,'0');document.getElementById('id').value=id;await q.stop();msg('QR ተነቧል። አሁን GPS አረጋግጥ ከዚያ Check-in/Check-out ያድርጉ።','ok')})}catch(e){msg('Camera ፈቃድ ያስፈልጋል።','err')}}function admin(){if(pin.value==='12345678')panel.classList.remove('hide');else alert('Admin PIN ትክክል አይደለም።')}function report(){let d=data(),csv='Date,ID,Name,Check-in,Check-out\n';Object.keys(d).forEach(dt=>Object.keys(d[dt]).forEach(id=>{let r=d[dt][id];csv+=`${dt},${id},"${r.name}",${r.in},${r.out}\n`}));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='SMART_Attendance_Report.csv';a.click()}render();</script></body></html>
